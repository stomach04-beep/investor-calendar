name: Tests

# fetch_schedules.py の日程ロジックの回帰テスト。
# BLS は bot ブロックで恒常的に 403 のため真値表が実質の本番経路になる。
# 真値表が公式日程からズレたら、Notion に反映される前にここで落とす。

on:
  pull_request:
  push:
    branches: [main]
  # 週1回も走らせる（2026-10-22 追加）。毎朝の同期は github-actions[bot] の push なので
  # このワークフローを起動しない。データ（シード・控え）の伸びだけでテストが壊れても、
  # 次に誰かが PR を出すまで気づけなかった（10-06〜10-22 の2件）。
  # 失敗は health-watchdog の GitHub 監視で LINE に届く。
  schedule:
    - cron: "10 22 * * 0"   # 毎週月曜 07:10 JST（朝の同期 06:35 の後）
  workflow_dispatch:

permissions:
  contents: read   # テストのみ。書き込み不要（最小権限）

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 依存パッケージのインストール
        run: pip install -r requirements-dev.txt

      - name: pytest 実行
        run: python -m pytest tests/ -v
